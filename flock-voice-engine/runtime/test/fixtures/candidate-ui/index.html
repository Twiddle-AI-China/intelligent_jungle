<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="/mvp/">
  <title>Flock Runtime Candidate UI</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f2ead8; color: #2e3e8f; }
    body { display: grid; grid-template-rows: auto 1fr; font: 12px ui-monospace, monospace; }
    header { display: flex; gap: 16px; align-items: center; padding: 8px; border-bottom: 1px solid; }
    canvas { width: 100%; height: 100%; display: block; }
    .candidate-latent-roamer { position: fixed; right: 12px; top: 52px; width: 480px; padding: 8px; background: #f2ead8; border: 1px solid; z-index: 2; }
    .candidate-latent-map { width: 480px; height: 320px; }
  </style>
</head>
<body>
  <header>
    <span data-runtime-status>connecting</span>
    <span data-world-generation></span>
    <span data-revision>0</span>
    <span data-event-seq>0</span>
    <span data-agent-species></span>
    <span data-agent-master></span>
    <button type="button" data-command="runtime.pause">pause</button>
    <button type="button" data-command="runtime.resume">resume</button>
    <button type="button" data-open-latent="melody">latent melody</button>
  </header>
  <canvas id="world"></canvas>
  <script type="module" src="/flock-voice-engine/runtime/test/fixtures/candidate-ui/shadow-app.js"></script>
</body>
</html>
