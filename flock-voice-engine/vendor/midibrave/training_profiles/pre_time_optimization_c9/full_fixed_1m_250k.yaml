seed: 20260716
data:
  # Quality-first full-compute profile. It deliberately keeps the validated
  # 49,152/75% data contract and reuses the frozen full eligible manifest.
  manifest: /data/midibrave/manifests/serum_strict_1822_eligible.jsonl
  cache_root: /data/midibrave/cache/serum_strict_1822
  dataset_root: /data/datasets/latent-cosmos-synth/serum-dataset
  preset_manifest: /data/datasets/latent-cosmos-synth/serum-dataset/metadata/presets.jsonl
  manifest_metadata: /data/midibrave/manifests/serum_strict_1822_eligible.meta.json
  split: train
  sample_rate: 44100
  window_samples: 49152
  note_min: 21
  note_max: 109
  velocities: [50, 127]
  repeats: 16
  num_workers: 8
  prefetch_factor: 2
  clap_checkpoint: /data/model_weights/laion-clap/music_audioset_epoch_15_esc_90.14.pt
  minimum_distinct_notes_per_preset: 4
  pitch_hop_length: 128
  pitch_confidence_min: 0.5
  pitch_cents_tolerance: 50.0
  stable_edge_seconds: 0.15
  pitch_window_valid_ratio_min: 0.75
  pitch_energy_floor_db: -60.0
  pitch_energy_dynamic_range_db: 40.0
  require_pitch_cache: true
model:
  clap_dim: 512
  timbre_dim: 128
  midi_dim: 32
  capacity: 64
  pqmf_bands: 16
  ratios: [2, 2, 2, 1]
  pitch_backend: differentiable_crepe_tiny
  pqmf_taps: 256
  anti_image_taps: 31
  warmup_latent_frames: 64
  excitation_harmonics: 128
  excitation_rms: 0.1
  static_condition_fast_path: true
  cache_excitation_bands: true
  excitation_cache_note_chunk: 8
  condition_gain_hidden: 0
loss:
  # C9 is deliberately shared with the optimized profile. The comparison must
  # isolate compute/budget changes instead of reintroducing the broken old loss.
  self_stft: 1.0
  self_envelope: 0.05
  self_pitch: 0.5
  self_rms: 0.25
  cross_stft: 0.5
  cross_envelope: 0.0125
  cross_pitch: 1.0
  cross_rms: 0.5
  velocity_rank: 0.5
  timbre_pair: 0.1
  distribution: 0.01
  pitch_adversary: 0.1
  adversarial: 1.0
  feature_matching: 2.0
  pitch_temperature: 0.1
  pitch_target_sigma_cents: 25.0
  pitch_kl: 0.0
  pitch_activation: 1.0
  pitch_hard_negative: 0.25
  pitch_autocorrelation: 20.0
  pitch_negative_margin_logits: 1.0
  pitch_negative_exclusion_cents: 100.0
  pitch_negative_temperature: 0.25
  velocity_delta: 0.0
  velocity_delta_scale_db: 6.0
  velocity_margin_db: 1.0
  latent_std_floor: 0.2
  latent_distribution_backend: gather
train:
  phase1_steps: 1000000
  phase2_steps: 250000
  # Reference mapping for 8 GPUs: 8 x 10 x grad_accum 1 = global pair batch 80.
  # Keep the global value at 80 when adapting microbatching to a cloud machine.
  batch_per_gpu: 10
  grad_accum: 1
  lr: 0.0002
  min_lr: 0.00002
  warmup_steps: 10000
  phase2_generator_lr: 0.00001
  phase2_condition_lr: 0.000001
  discriminator_lr: 0.0002
  pitch_adversary_start: 100000
  pitch_adversary_ramp: 20000
  grad_clip: 1.0
  checkpoint_every: 10000
  log_every: 21
  output_dir: /data/midibrave/runs
  run_name: midibrave_c9_quality_first_full_compute
  grad_scaler_init_scale: 2.0
  grad_scaler_growth_interval: 2000
  self_full_fraction: 1.0
  self_probability: 1.0
  # Algebra-preserving throughput/memory optimizations remain enabled.
  fused_adamw: true
  ddp_gradient_as_bucket_view: true
  ddp_static_graph: false
  ddp_bucket_cap_mb: 16
  compile_decoder: false
  compile_discriminator: false
  compile_mode: default
