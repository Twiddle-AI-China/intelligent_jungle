# Midibrave Roamer on Spark. TLS terminates on Gilmour and the neural audio
# service is reached through a loopback-only reverse SSH tunnel.

limit_conn_zone $server_name zone=midibrave_audio_slots:10m;

server {
    listen 80;
    server_name midibrave.twiddle-ai.com.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name midibrave.twiddle-ai.com.cn;

    sendfile off;
    ssl_certificate /etc/letsencrypt/live/midibrave-twiddle-ai-com-cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/midibrave-twiddle-ai-com-cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8092;
        proxy_set_header Origin http://localhost:8092;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /decoder {
        limit_conn midibrave_audio_slots 4;
        limit_conn_status 503;

        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8092;
        proxy_set_header Origin http://localhost:8092;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8092;
        proxy_set_header Origin "";
        proxy_buffering off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/midibrave.twiddle-ai.com.cn.access.log;
    error_log /var/log/nginx/midibrave.twiddle-ai.com.cn.error.log;
}
