<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100f" />
    <title>Latent Cosmos Synth — MVP</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">BOIDS SOUND WORLD · MVP 0.2</p>
          <h1>Latent Cosmos <i>Synth</i></h1>
        </div>
        <div class="header-actions">
          <span id="engine-fact" class="engine-fact">声音链：尚未启动</span>
          <button id="midi-button" class="quiet">连接 MIDI</button>
          <button id="audio-button" class="audio-button">唤醒声音</button>
        </div>
      </header>

      <section class="world-panel">
        <canvas id="world" aria-label="持续演化的声音对象世界"></canvas>
        <div class="world-copy">
          <span id="mode-kicker">当前行为</span>
          <strong id="mode-title">加鸟</strong>
          <p id="mode-description">点击世界，为所选声音群增加一个行为粒子</p>
        </div>
        <div id="pointer-label" class="pointer-label">按住并拖动</div>
      </section>

      <section class="controls" aria-label="世界行为控制">
        <div class="behavior-strip" id="behavior-strip"></div>
        <div class="species-picker"><span>声音群</span><div id="species-strip"></div></div>
        <button id="new-flock-button" class="release">新增声源</button>
      </section>

      <section class="lower-grid">
        <article class="harmony-card">
          <div class="section-heading">
            <div><span>HARMONIC GRAVITY</span><h2>和声引力</h2></div>
            <output id="harmony-output">C · Dorian</output>
          </div>
          <div class="harmony-buttons" id="harmony-buttons"></div>
          <p>纵向音级带决定 Dorian 音高；可见的 PULSE 波扫过鸟时触发声音。XY 在 checkpoint 生成的 2D→4D 曲面上控制音色。</p>
        </article>

        <article class="telemetry-card">
          <div class="section-heading"><div><span>WORLD SIGNALS</span><h2>世界信号</h2></div><em id="object-count">3 VOICES · 21 BOIDS</em></div>
          <div class="meters">
            <label>语境聚合 <meter id="context-meter" min="0" max="1"></meter></label>
            <label>趋势对齐 <meter id="trend-meter" min="0" max="1"></meter></label>
            <label>声部清晰 <meter id="clarity-meter" min="0" max="1"></meter></label>
          </div>
          <div id="voice-audit" class="voice-audit" aria-label="Voice 独奏静音与电平诊断"></div>
        </article>
      </section>

      <footer><span id="status">世界正在静默运行</span><span>1 加鸟 · 2 障碍 · 3 引导 · 4 擦除</span></footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
