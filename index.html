<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100f" />
    <title>Latent Cosmos — 生态音序器</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">ECO SEQUENCER · 生态音序器</p>
          <h1>Latent Cosmos <i>四棵树</i></h1>
        </div>
        <div class="header-actions">
          <span id="engine-fact" class="engine-fact">声音链：Web Audio 轻量合成器</span>
          <button id="audio-button" class="audio-button">唤醒声音</button>
        </div>
      </header>

      <section class="master-hud" aria-label="Master 层控制">
        <span id="master-badge" class="controller-badge">主脉 · 生态自持</span>
        <label class="hud-control">气温
          <input id="bpm-slider" type="range" min="48" max="140" step="1" value="82" />
          <output id="bpm-output">82</output>
        </label>
        <label class="hud-control">季节
          <select id="chord-quality" aria-label="季节/和弦色彩">
            <option value="major">春（明亮）</option>
            <option value="sus4">夏（张力）</option>
            <option value="minor7">秋（雾霭）</option>
            <option value="minor" selected>冬（幽暗）</option>
          </select>
        </label>
        <button id="master-release" class="quiet" hidden>交还主脉</button>
      </section>

      <div class="world-layout">
        <section class="world-panel">
          <canvas id="world" aria-label="四棵树生态画布"></canvas>
          <div class="world-copy">
            <span id="mode-kicker">生态音序器</span>
            <strong id="mode-title">四棵树</strong>
            <p id="mode-description">双击某棵树贴近（键盘 A–K 召唤落鸟），拖拽引导鸟群，Esc 缩出交还</p>
          </div>
        </section>
        <aside class="voice-strip" aria-label="声部条">
          <div class="section-heading"><span>TREES</span><h2>四棵树</h2></div>
          <div id="voice-audit" class="voice-audit"></div>
          <div class="section-heading"><span>ECO</span><h2>生态</h2></div>
          <div id="eco-hud" class="eco-hud"></div>
          <div class="section-heading"><span>KEYS</span><h2>键盘 → 枝干</h2></div>
          <div id="key-map" class="key-map"></div>
        </aside>
      </div>

      <footer>
        <span id="status">四棵树静立 · 唤醒声音后扫描线扫过即鸣</span>
        <span>双击贴近 · Esc 缩出</span>
      </footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
