<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100f" />
    <title>Latent Cosmos Synth — MVP</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">PERCEPTUAL WORLD · MVP 0.1</p>
          <h1>Latent Cosmos <i>Synth</i></h1>
        </div>
        <div class="header-actions">
          <button id="midi-button" class="quiet">连接 MIDI</button>
          <button id="audio-button" class="audio-button">唤醒声音</button>
        </div>
      </header>

      <section class="world-panel">
        <canvas id="world" aria-label="持续演化的声音对象世界"></canvas>
        <div class="world-copy">
          <span id="mode-kicker">当前行为</span>
          <strong id="mode-title">聚拢</strong>
          <p id="mode-description">把声音带入共同脉冲与和声语境</p>
        </div>
        <div id="pointer-label" class="pointer-label">按住并拖动</div>
      </section>

      <section class="controls" aria-label="世界行为控制">
        <div class="behavior-strip" id="behavior-strip"></div>
        <button id="release-button" class="release">释放 <kbd>Space</kbd></button>
      </section>

      <section class="lower-grid">
        <article class="harmony-card">
          <div class="section-heading">
            <div><span>HARMONIC GRAVITY</span><h2>和声引力</h2></div>
            <output id="harmony-output">C · Dorian</output>
          </div>
          <div class="harmony-buttons" id="harmony-buttons"></div>
          <p>MIDI Note 改变引力中心，Velocity 注入世界能量。</p>
        </article>

        <article class="telemetry-card">
          <div class="section-heading"><div><span>WORLD SIGNALS</span><h2>世界信号</h2></div><em id="object-count">6 OBJECTS</em></div>
          <div class="meters">
            <label>语境聚合 <meter id="context-meter" min="0" max="1"></meter></label>
            <label>趋势对齐 <meter id="trend-meter" min="0" max="1"></meter></label>
            <label>声部清晰 <meter id="clarity-meter" min="0" max="1"></meter></label>
          </div>
        </article>
      </section>

      <footer><span id="status">世界正在静默运行</span><span>拖动施力 · 松手延续 · 1—5 切换行为</span></footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
