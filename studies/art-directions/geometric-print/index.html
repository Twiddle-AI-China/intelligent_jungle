<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ECA11D'/%3E%3C/svg%3E">
  <title>方向 A · 几何版画</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #1d2b2a; overflow: hidden; }
    body { display: grid; place-items: center; }
    img { width: 100%; height: 100%; object-fit: contain; display: block; animation: breathe 14s ease-in-out infinite alternate; }
    @keyframes breathe { from { transform: scale(1); filter: saturate(.96); } to { transform: scale(1.018); filter: saturate(1.06); } }
    @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  </style>
</head>
<body><img src="render.png" alt="暖色几何版画风的中央大树、栖鸟与绕树飞鸟"></body>
</html>
