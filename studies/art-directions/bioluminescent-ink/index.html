<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2319C5C7'/%3E%3C/svg%3E">
  <title>方向 D · 夜光水墨</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #020b21; overflow: hidden; }
    body { display: grid; place-items: center; }
    img { width: 100%; height: 100%; object-fit: contain; display: block; animation: glow 10s ease-in-out infinite alternate; }
    @keyframes glow { from { transform: scale(1); filter: brightness(.92) saturate(.94); } to { transform: scale(1.018); filter: brightness(1.08) saturate(1.12); } }
    @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  </style>
</head>
<body><img src="render.png" alt="深靛夜光水墨风的中央大树、栖鸟与绕树飞鸟"></body>
</html>
