<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>树-鸟生态音序器</title>
  <link rel="icon" href="data:," />
  <style>
    /* duotone-riso 三 token：纸底靛字橙强调；无阴影、无渐变、无玻璃感。
       色值由 main.js 从 config.visual 注入（唯一来源），此处只消费 var()。 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--paper); }
    body { display: flex; font-family: ui-monospace, Menlo, monospace; color: var(--ink); }
    #scene { flex: 1; min-width: 0; height: 100%; display: block; }
    #side {
      width: 360px; height: 100%; display: flex; flex-direction: column;
      background: var(--paper); overflow-y: auto;
    }
    /* N 树（≥2）时面板变高：子项不压缩，整栏滚动兜底 */
    #side > * { flex-shrink: 0; }
    #status {
      padding: 12px 14px 2px; font-size: 12px; line-height: 1.5;
      color: var(--ink); white-space: nowrap; font-weight: bold;
    }
    #transport {
      padding: 0 14px 8px; font-size: 11px; line-height: 1.5;
      color: var(--accent); white-space: nowrap;
    }
    #species-bar { display: flex; gap: 8px; padding: 4px 14px 10px; flex-wrap: wrap; align-items: center; }
    #species-bar button {
      font: inherit; font-size: 11px; padding: 4px 12px; cursor: pointer;
      background: var(--paper); color: var(--ink);
      border: 1.5px solid var(--ink); border-radius: 0;
    }
    #species-bar button.active { background: var(--accent); border-color: var(--accent); color: var(--paper); }
    #species-bar .bar-sep { flex-basis: 100%; height: 0; }
    #species-bar .bar-label { font-size: 10px; opacity: 0.6; }
    #bpm { flex: 1; min-width: 90px; accent-color: var(--accent); }
    #api-key {
      font: inherit; font-size: 11px; padding: 4px 8px; width: 100%;
      background: var(--paper); color: var(--ink);
      border: 1.5px solid var(--ink); border-radius: 0; outline: none;
    }
    #api-key:focus { border-color: var(--accent); }
    #pattern {
      padding: 2px 14px 10px; font-size: 11px; line-height: 1.7; white-space: pre;
      color: var(--ink); opacity: 0.75;
      max-height: 34vh; overflow-y: auto; /* 树多时枝位面板限高自滚 */
    }
    #log-title, .panel-title {
      padding: 6px 14px 4px; font-size: 11px; color: var(--accent);
      letter-spacing: 0.08em;
    }
    #eco {
      padding: 0 14px 8px; font-size: 11px; line-height: 1.7; white-space: pre;
      color: var(--ink); opacity: 0.85;
    }
    #timeline { max-height: 180px; overflow-y: auto; padding: 0 14px 8px; }
    #record-btn.recording { background: var(--accent); border-color: var(--accent); color: var(--paper); }
    #decision-log {
      flex: 1 0 auto; min-height: 200px; overflow-y: auto; padding: 0 14px 14px; font-size: 11px; line-height: 1.75;
    }
    .log-row { padding: 1px 0; }
    .log-event { color: var(--ink); opacity: 0.62; }
    .log-day { color: var(--accent); font-weight: bold; margin-top: 8px; }
    .log-variation { color: var(--ink); font-weight: bold; }
    .log-stats { color: var(--ink); opacity: 0.62; }
    .log-plan { color: var(--ink); opacity: 0.85; }
    .log-apply { color: var(--ink); font-weight: bold; }
    .log-chord { color: var(--accent); }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--paper); z-index: 10;
    }
    #overlay.hidden { display: none; }
    #start-btn {
      font: inherit; font-size: 15px; padding: 14px 32px; cursor: pointer;
      background: var(--accent); color: var(--paper);
      border: none; border-radius: 0; letter-spacing: 0.05em;
    }
    #start-btn:hover { background: var(--ink); }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <aside id="side">
    <div id="status">加载中…</div>
    <div id="transport"></div>
    <div id="species-bar">
      <span class="bar-label">tempo</span>
      <input type="range" id="bpm" min="50" max="140" step="1" value="60" />
      <span id="bpm-label" class="bar-label"></span>
      <span class="bar-sep"></span>
      <input type="password" id="api-key" placeholder="MiniMax API key（仅内存）" autocomplete="off" />
      <button id="record-btn" title="录制音频导出 webm">● 录制</button>
    </div>
    <div id="pattern"></div>
    <div id="eco"></div>
    <div class="panel-title">决策时间线（今天复盘昨天 · 明天生效）</div>
    <div id="timeline"></div>
    <div id="log-title">决策日志（按天分组 · 黄昏日评估 / 起落事件）</div>
    <div id="decision-log"></div>
  </aside>
  <div id="overlay">
    <button id="start-btn">▶ 进入（启用音频）</button>
  </div>
  <script src="./local-config.js" onerror="void 0"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
